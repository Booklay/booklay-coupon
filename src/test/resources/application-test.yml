spring:
  config:
    activate:
      on-profile: "test"
  h2:
    console:
      enabled: true

    datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MYSQL
    username: sa
    password:


  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        globally_quoted_identifiers: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true
  kafka:
    consumer:
      group-id: coupon-test

cloud:
  auth-url: https://api-identity.infrastructure.cloud.toast.com/v2.0
  user-name: REDACTED
  password: REDACTED
  tenant-id: REDACTED
  storage-url: https://api-storage.cloud.toast.com/v1/AUTH_REDACTED
  container: /booklay_storage/

booklay:
  secure:
    appkey: REDACTED
    db_username: REDACTED
    db_url: REDACTED
    db_password: REDACTED
    url: https://api-keymanager.nhncloudservice.com/keymanager/v1.0/appkey/REDACTED/secrets/
    p12_password: 1234
  pool_size: 2
  jwt:
    secret: test

  gateway-origin: http://localhost:8080
  domain-origin: http://localhost:6060
  gw-url: http://127.0.0.1
message:
  topic:
    coupon:
      request: coupon-zone-request
      response: coupon-zone-response

coupon:
